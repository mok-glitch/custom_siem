<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - SIEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #e5e7eb;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }

        .navbar {
            background: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 28px;
            color: #3b82f6;
        }

        .logo h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            padding: 8px 16px;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-links a:hover {
            background: #1f2937;
            color: #3b82f6;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .datetime {
            font-size: 14px;
            color: #9ca3af;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #1f2937;
            border: none;
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        .main-content {
            margin-top: 80px;
            padding: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #1f2937;
            border: none;
            border-radius: 10px;
            color: #e5e7eb;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #374151;
            transform: translateX(-4px);
        }

        .event-header {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid #374151;
        }

        .event-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .event-title i {
            color: #3b82f6;
            font-size: 32px;
        }

        .event-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #374151;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-item i {
            color: #3b82f6;
            width: 20px;
        }

        .meta-item strong {
            color: #9ca3af;
        }

        .details-card {
            background: #111827;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #1f2937;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 12px;
        }

        .card-title i {
            color: #3b82f6;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #1f2937;
            border-radius: 10px;
        }

        .detail-label {
            font-weight: 600;
            color: #9ca3af;
        }

        .detail-value {
            font-family: 'Courier New', monospace;
            color: #3b82f6;
            font-weight: 500;
        }

        .command-line-full {
            background: #1f2937;
            padding: 16px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 10px;
        }

        .related-events {
            background: #111827;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #1f2937;
        }

        .related-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .related-table th, .related-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #1f2937;
        }

        .related-table th {
            color: #9ca3af;
            font-weight: 600;
        }

        .related-table tr:hover {
            background: #1f2937;
            cursor: pointer;
        }

        .cpu-high {
            color: #ef4444;
            font-weight: 600;
        }

        .cpu-medium {
            color: #f59e0b;
            font-weight: 600;
        }

        .memory-high {
            color: #ef4444;
            font-weight: 600;
        }

        .process-name {
            color: #3b82f6;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading i {
            animation: pulse 1s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .details-grid {
                grid-template-columns: 1fr;
            }
            
            .event-meta {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-shield-haltered"></i>
                <h2>SIEM Platform</h2>
            </div>
            <div class="nav-links">
                <a href="/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="/logs"><i class="fas fa-file-alt"></i> System Logs</a>
                <a href="/network_logs"><i class="fas fa-network-wired"></i> Network Logs</a>
                <a href="/alerts"><i class="fas fa-bell"></i> Alerts</a>
            </div>
            <div class="user-info">
                <div class="datetime" id="datetime"></div>
                <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <a href="/logs" class="back-button">
            <i class="fas fa-arrow-left"></i> Back to System Logs
        </a>

        <div id="eventContent">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading event details...</div>
        </div>
    </div>

    <script>
        // Get event ID from URL
        const eventId = window.location.pathname.split('/').pop();

        function updateDateTime() {
            const now = new Date();
            const datetimeStr = now.toLocaleString('en-US', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            });
            document.getElementById('datetime').textContent = datetimeStr;
        }

        async function fetchEventDetails() {
            try {
                const response = await fetch(`/api/event/${eventId}`);
                const data = await response.json();
                
                if (response.ok) {
                    renderEventDetails(data);
                } else {
                    document.getElementById('eventContent').innerHTML = `
                        <div class="details-card">
                            <div class="card-title">
                                <i class="fas fa-exclamation-triangle"></i>
                                Error
                            </div>
                            <p>Event not found or has been removed.</p>
                            <a href="/logs" class="back-button" style="margin-top: 20px; display: inline-block;">
                                <i class="fas fa-arrow-left"></i> Return to Logs
                            </a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error fetching event details:', error);
                document.getElementById('eventContent').innerHTML = `
                    <div class="details-card">
                        <div class="card-title">
                            <i class="fas fa-exclamation-triangle"></i>
                            Error
                        </div>
                        <p>Failed to load event details. Please try again.</p>
                    </div>
                `;
            }
        }

        function renderEventDetails(data) {
            const event = data.event;
            const relatedEvents = data.related_events;
            
            const cpuClass = event.cpu_percent > 80 ? 'cpu-high' : (event.cpu_percent > 50 ? 'cpu-medium' : '');
            const memClass = event.memory_mb > 700 ? 'memory-high' : '';
            
            const html = `
                <div class="event-header">
                    <div class="event-title">
                        <i class="fas fa-microchip"></i>
                        System Event #${event.id}
                    </div>
                    <div class="event-meta">
                        <div class="meta-item">
                            <i class="fas fa-calendar"></i>
                            <strong>Timestamp:</strong> ${new Date(event.timestamp).toLocaleString()}
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-microchip"></i>
                            <strong>PID:</strong> ${event.pid}
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-user"></i>
                            <strong>User:</strong> ${escapeHtml(event.user)}
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-tag"></i>
                            <strong>Status:</strong> ${escapeHtml(event.status)}
                        </div>
                    </div>
                </div>

                <div class="details-card">
                    <div class="card-title">
                        <i class="fas fa-chart-line"></i>
                        Resource Metrics
                    </div>
                    <div class="details-grid">
                        <div class="detail-row">
                            <span class="detail-label">CPU Usage:</span>
                            <span class="detail-value ${cpuClass}">${event.cpu_percent}%</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Memory Usage:</span>
                            <span class="detail-value ${memClass}">${event.memory_mb} MB</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Process Name:</span>
                            <span class="detail-value process-name">${escapeHtml(event.process_name)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Process ID:</span>
                            <span class="detail-value">${event.pid}</span>
                        </div>
                    </div>
                </div>

                <div class="details-card">
                    <div class="card-title">
                        <i class="fas fa-terminal"></i>
                        Full Command Line
                    </div>
                    <div class="command-line-full">
                        <i class="fas fa-dollar-sign" style="color: #10b981;"></i> ${escapeHtml(event.command_line)}
                    </div>
                </div>

                <div class="related-events">
                    <div class="card-title">
                        <i class="fas fa-link"></i>
                        Related Events (Same Process - ±1 Hour)
                        <span style="font-size: 12px; margin-left: auto;">${relatedEvents.length} events found</span>
                    </div>
                    ${relatedEvents.length > 0 ? `
                        <table class="related-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Timestamp</th>
                                    <th>CPU %</th>
                                    <th>Memory MB</th>
                                    <th>User</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${relatedEvents.map(rel => {
                                    const relCpuClass = rel.cpu_percent > 80 ? 'cpu-high' : (rel.cpu_percent > 50 ? 'cpu-medium' : '');
                                    const relMemClass = rel.memory_mb > 700 ? 'memory-high' : '';
                                    return `
                                        <tr onclick="window.location.href='/event/${rel.id}'">
                                            <td>#${rel.id}</td>
                                            <td>${new Date(rel.timestamp).toLocaleString()}</td>
                                            <td class="${relCpuClass}">${rel.cpu_percent}%</td>
                                            <td class="${relMemClass}">${rel.memory_mb} MB</td>
                                            <td>${escapeHtml(rel.user)}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    ` : '<p style="color: #9ca3af; text-align: center; padding: 40px;">No related events found in the last hour</p>'}
                </div>
            `;
            
            document.getElementById('eventContent').innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        updateDateTime();
        setInterval(updateDateTime, 1000);
        fetchEventDetails();
    </script>
</body>
</html>
