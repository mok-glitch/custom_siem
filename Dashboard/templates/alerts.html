<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - SIEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #e5e7eb;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }

        .navbar {
            background: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 28px;
            color: #3b82f6;
        }

        .logo h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            padding: 8px 16px;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            background: #1f2937;
            color: #3b82f6;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .datetime {
            font-size: 14px;
            color: #9ca3af;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #1f2937;
            border: none;
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        .main-content {
            margin-top: 80px;
            padding: 24px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #9ca3af;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #111827;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1f2937;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #9ca3af;
            font-size: 14px;
        }

        .filters-card {
            background: #111827;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1f2937;
            margin-bottom: 24px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select, .filter-group input {
            padding: 10px 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 24px;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .alerts-table-container {
            background: #111827;
            border-radius: 16px;
            border: 1px solid #1f2937;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #1f2937;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #1f2937;
        }

        tr {
            transition: all 0.2s ease;
        }

        tr:hover {
            background: #1f2937;
        }

        .severity-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .severity-critical { background: #ef4444; color: white; }
        .severity-high { background: #f59e0b; color: white; }
        .severity-medium { background: #eab308; color: black; }
        .severity-low { background: #10b981; color: white; }

        .status-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-open { background: #ef4444; color: white; }
        .status-confirmed { background: #10b981; color: white; }
        .status-false-positive { background: #6b7280; color: white; }

        .mitre-tag {
            background: #1f2937;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            display: inline-block;
            margin: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-confirm {
            background: #10b981;
            color: white;
        }

        .btn-confirm:hover {
            background: #059669;
        }

        .btn-false {
            background: #6b7280;
            color: white;
        }

        .btn-false:hover {
            background: #4b5563;
        }

        .clickable-row {
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .resolved-badge {
            background: #374151;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #9ca3af;
            display: inline-block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading i {
            animation: pulse 1s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-shield-haltered"></i>
                <h2>SIEM Platform</h2>
            </div>
            <div class="nav-links">
                <a href="/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="/logs"><i class="fas fa-file-alt"></i> System Logs</a>
                <a href="/network_logs"><i class="fas fa-network-wired"></i> Network Logs</a>
                <a href="/alerts" class="active"><i class="fas fa-bell"></i> Alerts</a>
                <a href="/auth_logs"><i class="fas fa-key"></i> Auth Logs</a>
            </div>
            <div class="user-info">
                <div class="datetime" id="datetime"></div>
                <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-bell"></i> Security Alerts</h1>
            <p>Detected threats and security incidents</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalAlerts">0</div>
                <div class="stat-label">Total Alerts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="openAlerts">0</div>
                <div class="stat-label">Open</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="confirmedAlerts">0</div>
                <div class="stat-label">Confirmed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="falsePositiveAlerts">0</div>
                <div class="stat-label">False Positive</div>
            </div>
        </div>

        <div class="filters-card">
            <div class="filters-grid">
                <div class="filter-group">
                    <label><i class="fas fa-exclamation-triangle"></i> Severity</label>
                    <select id="severityFilter">
                        <option value="All">All</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-check-circle"></i> Status</label>
                    <select id="statusFilter">
                        <option value="All">All</option>
                        <option value="Open">Open</option>
                        <option value="Confirmed">Confirmed</option>
                        <option value="False Positive">False Positive</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-calendar"></i> Date From</label>
                    <input type="datetime-local" id="dateFrom">
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-calendar"></i> Date To</label>
                    <input type="datetime-local" id="dateTo">
                </div>
            </div>
            <button class="btn-primary" onclick="applyFilters()">
                <i class="fas fa-filter"></i> Apply Filters
            </button>
        </div>

        <div class="alerts-table-container">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Title</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>MITRE ATT&CK</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="alertsTableBody">
                        <tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading alerts...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const datetimeStr = now.toLocaleString('en-US', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            });
            document.getElementById('datetime').textContent = datetimeStr;
        }

        async function fetchAlerts() {
            const severity = document.getElementById('severityFilter').value;
            const status = document.getElementById('statusFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            
            const params = new URLSearchParams({
                severity: severity,
                status: status,
                date_from: dateFrom,
                date_to: dateTo
            });
            
            try {
                const response = await fetch(`/api/alerts?${params}`);
                const data = await response.json();
                
                updateStats(data.stats);
                renderAlerts(data.data);
            } catch (error) {
                console.error('Error fetching alerts:', error);
            }
        }
        
        function updateStats(stats) {
            document.getElementById('totalAlerts').textContent = stats.total;
            document.getElementById('openAlerts').textContent = stats.open;
            document.getElementById('confirmedAlerts').textContent = stats.confirmed;
            document.getElementById('falsePositiveAlerts').textContent = stats.false_positive;
        }
        
        async function updateAlertStatus(alertId, newStatus, event) {
            event.stopPropagation();
            
            // Prevent updating if alert is already resolved
            try {
                const response = await fetch(`/api/alert/${alertId}/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (response.ok) {
                    fetchAlerts();
                }
            } catch (error) {
                console.error('Error updating alert:', error);
            }
        }
        
        function renderAlerts(alerts) {
            const tbody = document.getElementById('alertsTableBody');
            
            if (alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No alerts found</td></tr>';
                return;
            }
            
            tbody.innerHTML = alerts.map(alert => {
                const status = alert.status || 'Open';
                const isOpen = status === 'Open';
                const isConfirmed = status === 'Confirmed';
                const isFalsePositive = status === 'False Positive';
                
                return `
                    <tr class="clickable-row" onclick="window.location.href='/investigate/${alert.id}'">
                        <td>${new Date(alert.timestamp).toLocaleString()}</td>
                        <td><strong>${escapeHtml(alert.title)}</strong></td>
                        <td><span class="severity-badge severity-${alert.severity?.toLowerCase()}">${alert.severity}</span></td>
                        <td><span class="status-badge status-${status.toLowerCase().replace(' ', '-')}">${status}</span></td>
                        <td>
                            ${alert.mitre_techniques ? alert.mitre_techniques.map(tech => 
                                `<span class="mitre-tag">${escapeHtml(tech)}</span>`
                            ).join('') : '<span class="mitre-tag">T1071</span>'}
                        </td>
                        <td class="action-buttons">
                            ${isOpen ? `
                                <button class="btn-icon btn-confirm" onclick="updateAlertStatus('${alert.id}', 'Confirmed', event)">
                                    <i class="fas fa-check"></i> Confirm
                                </button>
                                <button class="btn-icon btn-false" onclick="updateAlertStatus('${alert.id}', 'False Positive', event)">
                                    <i class="fas fa-times"></i> False Positive
                                </button>
                            ` : `
                                <span class="resolved-badge">
                                    <i class="fas ${isConfirmed ? 'fa-check-circle' : 'fa-ban'}"></i>
                                    ${isConfirmed ? 'Confirmed' : 'Marked as False Positive'}
                                </span>
                            `}
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function applyFilters() {
            fetchAlerts();
        }
        
        updateDateTime();
        setInterval(updateDateTime, 1000);
        fetchAlerts();
        setInterval(fetchAlerts, 10000);
        
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchAlerts();
            }
        });
    </script>
</body>
</html>
